openapi: 3.0.3
info:
  title: Petstore
  version: 1.2.0
  description: Sample API for trying API Test Studio.
servers:
  - url: https://petstore.example.test/v1
security:
  - bearerAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags: [Pets]
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return (1-100).
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: status
          in: query
          schema: {type: string, enum: [available, pending, sold]}
      responses:
        '200':
          description: A page of pets
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Pet'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createPet
      summary: Create a pet
      description: Creates a pet. Names must be unique within the store.
      tags: [Pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPet'}
            example: {name: Rex, tag: dog}
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: A pet with this name already exists}
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPet
      summary: Get a pet
      tags: [Pets]
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Pet not found}
    patch:
      operationId: updatePet
      summary: Update a pet
      tags: [Pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 50}
                status: {type: string, enum: [available, pending, sold]}
      responses:
        '200':
          description: Updated pet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Pet not found}
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [Pets]
      responses:
        '204': {description: Deleted}
        '404': {description: Pet not found}
  /orders:
    post:
      operationId: placeOrder
      summary: Order a pet
      description: Places an order for an available pet. The pet status becomes pending.
      tags: [Store]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [petId, quantity]
              properties:
                petId: {type: string, format: uuid}
                quantity: {type: integer, minimum: 1, maximum: 5}
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Pet is not available}
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get an order
      tags: [Store]
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '404': {description: Order not found}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        tag: {type: string, maxLength: 20}
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id, status]
          properties:
            id: {type: string, format: uuid, readOnly: true}
            status: {type: string, enum: [available, pending, sold]}
    Order:
      type: object
      required: [id, petId, quantity, status]
      properties:
        id: {type: string, format: uuid}
        petId: {type: string, format: uuid}
        quantity: {type: integer}
        status: {type: string, enum: [placed, approved, delivered]}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
